spring.application.name=pantrypal

# Datasource (overridable via env for other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pantrypal}
spring.datasource.username=${DB_USERNAME:pantrypal}
spring.datasource.password=${DB_PASSWORD:pantrypal}

# JPA / Hibernate — schema is owned by Flyway, never auto-generated
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HS256). Override jwt.secret in every non-dev environment; must be >= 32 bytes.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
